<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>파도 리듬 | 오션시그널</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=app-ui22" />
  <style>
    .rhythm-trackbar{display:flex;align-items:center;gap:12px;padding:13px 22px;background:rgba(4,19,59,.76);border-top:1px solid rgba(147,231,255,.24);color:#d9f5ff;flex-wrap:wrap}.rhythm-trackbar label{font-size:10px;font-weight:800;letter-spacing:.1em;color:#7ee8ff}.rhythm-trackbar select{min-width:180px;border:1px solid rgba(130,228,255,.36);border-radius:10px;padding:8px 11px;background:#112d71;color:#f6fdff;font:600 12px 'Manrope','Noto Sans KR',sans-serif}.rhythm-trackbar #rhythmSpeedMode,.rhythm-trackbar #rhythmTrashMode{min-width:130px}.rhythm-trackbar small{margin-left:auto;color:#a9d7ee;font-size:10px}@media(max-width:650px){.rhythm-trackbar{align-items:flex-start;padding:12px 16px}.rhythm-trackbar select{flex:1;min-width:0}.rhythm-trackbar small{width:100%;margin-left:0}}
    .rhythm-note{width:52px;height:52px;top:-66px;border-radius:55% 45% 58% 42%/42% 48% 52% 58%;transform-origin:50% 75%;background:linear-gradient(145deg,#e5ffff 0 12%,#49dcff 38%,#1d83e8 76%);clip-path:polygon(50% 0,91% 42%,82% 82%,50% 100%,18% 82%,9% 42%);box-shadow:0 0 12px #d1ffff,0 0 32px #20cfff}.rhythm-note:after{content:'⌁';position:absolute;inset:9px 0 0;text-align:center;color:#f2ffff;font:700 25px/1 Georgia,serif;text-shadow:0 0 8px #0f76dc}.rhythm-note b{inset:7px;border-color:rgba(237,255,255,.6);border-radius:50%;transform:scale(.76)}.lane-1{background:linear-gradient(145deg,#f2dfff,#bd79ff);box-shadow:0 0 14px #e8cfff,0 0 32px #a864ff}.lane-2{background:linear-gradient(145deg,#fffcc8,#ffd65d);box-shadow:0 0 14px #fff6b0,0 0 32px #ffbd38}.lane-3{background:linear-gradient(145deg,#ffd5f2,#ff68c8);box-shadow:0 0 14px #ffd5f6,0 0 32px #ff61c7}.rhythm-burst{position:absolute;z-index:8;left:calc(50% - 4px);bottom:16%;width:9px;height:9px;border-radius:50%;background:#eaffff;box-shadow:0 -18px 0 -2px #7df7ff,16px -10px 0 -2px #4ad9ff,19px 6px 0 -2px #c5ffff,8px 18px 0 -2px #55bfff,-9px 18px 0 -2px #b4fbff,-18px 6px 0 -2px #58ddff,-16px -10px 0 -2px #d5ffff;animation:waveBurst .42s ease-out forwards;pointer-events:none}.rhythm-burst.good{background:#fffbd2;box-shadow:0 -17px 0 -2px #fff7a0,15px -8px 0 -2px #ffda62,17px 8px 0 -2px #fff1a0,7px 17px 0 -2px #ffcf4f,-8px 17px 0 -2px #fff2a9,-17px 8px 0 -2px #ffd45b,-15px -8px 0 -2px #fffbd2}@keyframes waveBurst{from{transform:scale(.35);opacity:1}to{transform:scale(2.2);opacity:0}}
  </style>
  <style>
    .rhythm-note{width:58px;height:104px;top:-112px;border:2px solid rgba(225,254,255,.92);border-radius:16px;clip-path:none;transform-origin:center;background:linear-gradient(180deg,#deffff 0%,#52dcfa 35%,#159be1 68%,#075ec2 100%);box-shadow:0 0 14px rgba(169,249,255,.95),0 0 34px rgba(22,149,233,.82),inset 0 1px 0 rgba(255,255,255,.82)}.rhythm-note:before{content:'';position:absolute;z-index:-1;left:50%;top:-78px;width:10px;height:82px;transform:translateX(-50%);border-radius:999px;background:linear-gradient(180deg,transparent,rgba(137,246,255,.15) 36%,rgba(135,243,255,.85));box-shadow:0 0 11px #8cf6ff}.rhythm-note:after{content:'⌁';inset:auto 0 12px;position:absolute;text-align:center;color:rgba(241,255,255,.94);font:700 28px/1 Georgia,serif;text-shadow:0 0 8px #0f76dc}.rhythm-note b{inset:auto;left:50%;bottom:16px;width:13px;height:13px;position:absolute;transform:translateX(-50%);border:2px solid rgba(244,255,255,.94);border-radius:50%;box-shadow:0 0 8px #fff;background:rgba(255,255,255,.26)}.rhythm-note.lane-1{background:linear-gradient(180deg,#dffeff,#67d3ef 36%,#187ccd 100%)}.rhythm-note.lane-2{background:linear-gradient(180deg,#efffff,#6ce0fb 40%,#138fd2 100%)}.rhythm-note.lane-3{background:linear-gradient(180deg,#d0f3ff,#3eb7e8 38%,#075aaf 100%)}.rhythm-note.trash-note{border-color:#ffd59d;background:linear-gradient(180deg,#ffd99d,#f59a3d 48%,#a84d15 100%);box-shadow:0 0 14px rgba(255,197,94,.9),0 0 30px rgba(239,112,32,.72)}.rhythm-note.trash-note:before{background:linear-gradient(180deg,transparent,rgba(255,203,116,.18) 36%,rgba(255,189,76,.82));box-shadow:0 0 11px #ffd36e}.rhythm-note.trash-note:after{content:'♻';font-family:Arial,sans-serif;font-size:31px;text-shadow:0 0 8px #78340f}.rhythm-note.trash-note b{background:rgba(96,43,12,.28);border-color:#fff0c7}@media(max-width:650px){.rhythm-note{width:44px;height:82px;top:-90px;border-radius:13px}.rhythm-note:before{top:-65px;height:68px}.rhythm-note:after{bottom:10px;font-size:22px}.rhythm-note b{bottom:12px;width:10px;height:10px}.rhythm-note.trash-note:after{font-size:25px}}
  </style>
</head>
<body class="rhythm-page">
  <main class="rhythm-shell">
    <a class="rhythm-back" href="index.html">← 오션시그널로 돌아가기</a>
    <section class="rhythm-game" aria-label="파도 리듬 게임">
      <header class="rhythm-head">
        <div><span class="rhythm-kicker">OCEAN RHYTHM / MINI GAME</span><h1>파도의 박자를<br /><em>따라가 보세요.</em></h1></div>
        <div class="rhythm-stats"><div><span>SCORE</span><b id="rhythmScore">000000</b></div><div><span>COMBO</span><b id="rhythmCombo">0</b></div><div><span>BEST</span><b id="rhythmBest">0</b></div></div>
      </header>
      <div class="rhythm-board" id="rhythmBoard">
        <div class="rhythm-stars"></div>
        <div class="rhythm-wave wave-one"></div><div class="rhythm-wave wave-two"></div>
        <div class="rhythm-lanes" aria-label="D F J K 키 또는 아래 파도 버튼을 누르세요"><div class="hit-line"></div><div class="lane" data-lane="0"></div><div class="lane" data-lane="1"></div><div class="lane" data-lane="2"></div><div class="lane" data-lane="3"></div></div>
        <div class="rhythm-feedback" id="rhythmFeedback" aria-live="polite">READY</div>
        <div class="rhythm-start" id="rhythmStart"><span>WAVE SIGNAL</span><strong>파도를 따라<br />리듬을 눌러요</strong><small>D · F · J · K 또는 버튼 탭</small><button id="rhythmStartButton" type="button">게임 시작 ↗</button></div>
        <div class="rhythm-end" id="rhythmEnd" hidden><span>OCEAN RHYTHM COMPLETE</span><strong id="rhythmResult">좋았어요!</strong><small id="rhythmResultDetail"></small><button id="rhythmRetryButton" type="button">한 번 더 하기</button></div>
      </div>
      <div class="rhythm-controls" aria-label="게임 입력 버튼"><button type="button" data-lane-button="0"><small>D</small><span>◜</span></button><button type="button" data-lane-button="1"><small>F</small><span>⌁</span></button><button type="button" data-lane-button="2"><small>J</small><span>⌁</span></button><button type="button" data-lane-button="3"><small>K</small><span>◝</span></button></div>
      <div class="rhythm-trackbar"><label for="rhythmTrack">FREE MUSIC</label><select id="rhythmTrack" aria-label="게임 음악 선택"><option value="tide">Tide Runner · 120 BPM</option><option value="sun">Summer Pulse · 128 BPM</option><option value="deep">Deep Sea Drift · 100 BPM</option></select><label for="rhythmDifficulty">LEVEL</label><select id="rhythmDifficulty" aria-label="게임 난이도 선택"><option value="easy">쉬움 · 파도 따라가기</option><option value="normal" selected>보통 · 리듬 타기</option><option value="hard">어려움 · 빠른 물결</option><option value="veryhard">매우 어려움 · 겹파도</option><option value="storm">폭풍 · 최고 난이도</option></select><label for="rhythmSpeedMode">SPEED</label><select id="rhythmSpeedMode" aria-label="낙하 속도 모드"><option value="steady" selected>일정 속도</option><option value="random">랜덤 속도</option></select><label for="rhythmTrashMode">TRASH</label><select id="rhythmTrashMode" aria-label="쓰레기 블록 모드"><option value="off" selected>쓰레기 없음</option><option value="every-third">타일 3개 뒤 쓰레기</option></select><small id="rhythmTrackInfo">기본 모드 · 일정 속도 / 쓰레기 없음</small></div>
      <p class="rhythm-tip">파도 블록이 수면선에 닿는 순간 누르세요. ♻ 쓰레기 블록은 누르면 -100점이니 피하세요.</p>
    </section>
  </main>
  <audio id="rhythmAudio" preload="none"></audio>
  <script src="wave-rhythm.js?v=8"></script>
</body>
</html>
